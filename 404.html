<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PlayLab is a bilingual portal for browsing classroom games and keeping scores on this device."
    />
    <title>PlayLab</title>
    <link rel="icon" type="image/svg+xml" href="/cursor-testing/favicon.svg" />
    <script type="module" crossorigin src="/cursor-testing/assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="/cursor-testing/assets/app.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite compiles /src/main.tsx. GitHub Pages serves this file unchanged and loads the committed bundle. -->
    <script>
      (function () {
        if (document.querySelector('script[src*="assets/app.js"]')) return;

        var marker = '/cursor-testing/';
        var path = location.pathname;
        if (path.charAt(path.length - 1) !== '/') path += '/';
        var at = path.indexOf(marker);
        var host = location.hostname;
        var local = host === 'localhost' || host === '127.0.0.1' || host === '[::1]';
        if (at === -1 && local) return;

        var root = at === -1 ? '/' : path.slice(0, at) + marker;
        var icon = document.querySelector('link[rel="icon"]');
        if (icon) icon.setAttribute('href', root + 'favicon.svg');

        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = root + 'assets/app.css';
        document.head.appendChild(css);

        var js = document.createElement('script');
        js.type = 'module';
        js.src = root + 'assets/app.js';
        document.body.appendChild(js);
      })();
    </script>
  </body>
</html>
